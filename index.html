<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПОРЯДОК В БИБЛИОТЕКЕ</title>
    <style>
        /* Основные стили, фон и шрифт Helvetica */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0705;
            /* УКАЖИТЕ ПУТЬ К ВАШЕЙ КАРТИНКЕ ЗДЕСЬ */
            background-image: url('bg.jpg'); 
            background-size: cover;
            background-position: center;
            user-select: none;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        #particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }

        /* UI и рамки */
        .ui-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 10, 5, 0.85);
            border: 2px solid #b8860b;
            border-radius: 10px;
            padding: 15px 40px;
            box-shadow: 0 0 20px rgba(184, 134, 11, 0.5), inset 0 0 15px rgba(184, 134, 11, 0.3);
            z-index: 10;
            text-align: center;
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        h1 {
            color: #ffd700;
            margin: 0;
            font-size: 26px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 140, 0, 0.8);
            font-weight: bold;
        }

        p.subtitle {
            color: #f5deb3;
            font-size: 18px;
            margin: 0;
            letter-spacing: 1px;
        }

        /* Кнопка рестарта */
        .btn {
            background: linear-gradient(to bottom, #8a5a19, #4a2f0b);
            border: 1px solid #ffd700;
            color: #f5deb3;
            padding: 8px 20px;
            font-size: 14px;
            font-family: inherit;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.8);
            transition: all 0.2s;
        }
        .btn:hover {
            background: linear-gradient(to bottom, #a87225, #5c3b0f);
            color: #fff;
            box-shadow: 0 0 10px #b8860b;
        }
        .btn:active { transform: scale(0.95); }

        /* Зона с кучей книг */
        #book-pile {
            position: absolute;
            bottom: 30px;
            left: 40px;
            width: 350px;
            height: 250px;
            z-index: 5;
            background: rgba(0, 0, 0, 0.4);
            border: 2px dashed rgba(184, 134, 11, 0.5);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .pile-label {
            position: absolute;
            bottom: -35px;
            width: 100%;
            text-align: center;
            color: #ffd700;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 1px 1px 5px black;
        }

        /* Контейнер полок */
        #shelves-container {
            position: absolute;
            top: 120px;
            right: 40px;
            width: calc(100% - 460px);
            max-width: 1000px;
            height: calc(100% - 150px);
            z-index: 5;
            display: flex;
            flex-direction: column;
            gap: 35px;
        }

        /* Полка */
        .shelf {
            width: 100%;
            height: 105px; /* Увеличено, чтобы вместить высокие книги */
            background: rgba(43, 23, 11, 0.75);
            border-bottom: 15px solid #3d2314;
            border-radius: 5px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.9);
            display: flex;
            align-items: flex-end; /* Книги выравниваются ИДЕАЛЬНО ровно по низу */
            justify-content: flex-start;
            flex-wrap: nowrap;
            padding: 0 10px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .shelf.drag-over {
            box-shadow: 0 10px 15px rgba(0,0,0,0.8), inset 0 0 40px rgba(184, 134, 11, 0.8);
            border-bottom: 15px solid #6b4423;
        }

        /* --- КНИГИ --- */
        .book {
            width: 20px; /* Чуть шире для декора */
            /* Высота будет задаваться через JS для разнообразия */
            border-radius: 3px 5px 5px 3px;
            cursor: grab;
            position: absolute;
            /* Сложная тень для придания объема обложке */
            box-shadow: -2px 0 5px rgba(0,0,0,0.8), inset 3px 0 4px rgba(255,255,255,0.15), inset -4px 0 8px rgba(0,0,0,0.7);
            border: 1px solid #1a0f0a;
            border-left: 2px solid rgba(255,255,255,0.1); /* Блик на левом крае */
            transition: opacity 0.1s, transform 0.3s ease;
        }

        .book:active { cursor: grabbing; }

        /* Декоративные элементы книги: золотые полосы и рельефные "ребра" корешка */
        .book::after {
            content: '';
            position: absolute;
            top: 8px; left: 0; width: 100%; height: 3px;
            background: rgba(212, 175, 55, 0.8); /* Золото */
            box-shadow: 
                0 45px 0 rgba(212, 175, 55, 0.8), /* Вторая золотая полоса */
                0 15px 0 1px rgba(0,0,0,0.6), /* Ребро 1 */
                0 30px 0 1px rgba(0,0,0,0.6); /* Ребро 2 */
            pointer-events: none;
        }

        /* Табличка с названием на корешке */
        .book::before {
            content: '';
            position: absolute;
            top: 15px; left: 2px; right: 2px; height: 18px;
            background: rgba(10, 5, 0, 0.85);
            border: 1px solid #b8860b;
            border-radius: 1px;
            pointer-events: none;
            box-shadow: inset 0 0 2px #000;
        }

        /* Поведение книги на полке */
        .shelf .book {
            position: relative !important;
            top: auto !important;
            left: auto !important;
            bottom: 0 !important;
            transform: none !important;
            margin-right: 1px !important;
            margin-bottom: 0 !important;
            flex-shrink: 1;
            transition: none; /* Убираем анимацию привязки, чтобы сразу встала ровно */
        }

        /* Цвета дорогих кожаных переплетов */
        .book.red { background: linear-gradient(to right, #540b0b, #8a1c1c, #4a0707); }
        .book.blue { background: linear-gradient(to right, #0b152b, #1c3560, #0a1326); }
        .book.green { background: linear-gradient(to right, #0b2410, #1c4a25, #0a210f); }
        .book.brown { background: linear-gradient(to right, #2e180b, #573017, #241208); }
        .book.purple { background: linear-gradient(to right, #240b30, #4d1c66, #1f0829); }

        /* Экран победы */
        #victory {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
        }
        #victory h2 {
            color: #ffd700;
            font-size: 50px;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 20px #ff8c00;
            margin: 0;
        }
    </style>
</head>
<body>

    <canvas id="particles"></canvas>

    <!-- UI Панель -->
    <div class="ui-panel">
        <h1>ПОРЯДОК В БИБЛИОТЕКЕ</h1>
        <p class="subtitle">Расставлено: <span id="score">0</span> / 200</p>
        <button class="btn" onclick="resetGame()">Начать заново</button>
    </div>

    <!-- Куча книг -->
    <div id="book-pile">
        <div class="pile-label">Неразобранные книги</div>
    </div>

    <!-- Полки -->
    <div id="shelves-container">
        <div class="shelf" ondrop="drop(event)" ondragover="allowDrop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></div>
        <div class="shelf" ondrop="drop(event)" ondragover="allowDrop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></div>
        <div class="shelf" ondrop="drop(event)" ondragover="allowDrop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></div>
        <div class="shelf" ondrop="drop(event)" ondragover="allowDrop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></div>
        <div class="shelf" ondrop="drop(event)" ondragover="allowDrop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></div>
    </div>

    <!-- Экран победы -->
    <div id="victory">
        <h2>Идеальный порядок!</h2>
        <p class="subtitle" style="font-size: 24px;">Библиотека спасена от хаоса.</p>
        <button class="btn" onclick="resetGame()" style="font-size: 18px; padding: 12px 30px;">Начать заново</button>
    </div>

    <script>
        // --- ЛОГИКА ИГРЫ ---
        const totalBooks = 200;
        let placedBooks = 0;
        const colorTypes = ['red', 'blue', 'green', 'brown', 'purple'];
        const pile = document.getElementById('book-pile');
        const scoreElement = document.getElementById('score');
        let allBooks = [];

        // Инициализация игры
        function initGame() {
            // Создаем массив с равным количеством цветов (по 40 каждого)
            let colorsArray = [];
            colorTypes.forEach(color => {
                for(let i = 0; i < (totalBooks / colorTypes.length); i++) {
                    colorsArray.push(color);
                }
            });

            // Алгоритм Фишера-Йетса для идеального перемешивания
            for (let i = colorsArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [colorsArray[i], colorsArray[j]] = [colorsArray[j], colorsArray[i]];
            }

            // Создание DOM элементов
            for (let i = 0; i < totalBooks; i++) {
                let book = document.createElement('div');
                book.className = 'book ' + colorsArray[i];
                book.id = 'book-' + i;
                book.draggable = true;
                
                // Случайная высота от 70 до 95px для реализма
                book.style.height = Math.floor(Math.random() * 25 + 70) + 'px';
                
                book.addEventListener('dragstart', dragStart);
                pile.appendChild(book);
                allBooks.push(book);
                
                randomizeBookInPile(book);
            }
        }

        // Разброс книги в куче
        function randomizeBookInPile(book) {
            let angle = Math.random() * Math.PI * 2;
            let radius = Math.random() * 110; // Радиус кучи
            let x = 175 + radius * Math.cos(angle) - 10; 
            let y = 125 + radius * Math.sin(angle) - 45; 
            let rotation = Math.random() * 180 - 90;

            book.style.position = 'absolute';
            book.style.left = x + 'px';
            book.style.top = y + 'px';
            book.style.transform = `rotate(${rotation}deg)`;
            book.style.zIndex = Math.floor(Math.random() * 200);
        }

        // Функция рестарта
        function resetGame() {
            document.getElementById('victory').style.display = 'none';
            placedBooks = 0;
            scoreElement.innerText = placedBooks;
            
            allBooks.forEach(book => {
                pile.appendChild(book); // Возвращаем в кучу
                randomizeBookInPile(book); // Задаем случайные координаты
            });
        }

        // --- DRAG & DROP ---
        function dragStart(e) {
            e.dataTransfer.setData("text", e.target.id);
            setTimeout(() => e.target.style.opacity = '0.4', 0);
        }

        function allowDrop(e) { e.preventDefault(); }

        function dragEnter(e) {
            e.preventDefault();
            if(e.currentTarget.classList.contains('shelf')) {
                e.currentTarget.classList.add('drag-over');
            }
        }

        function dragLeave(e) {
            if(e.currentTarget.classList.contains('shelf')) {
                e.currentTarget.classList.remove('drag-over');
            }
        }

        function drop(e) {
            e.preventDefault();
            let shelf = e.currentTarget;
            shelf.classList.remove('drag-over');

            let bookId = e.dataTransfer.getData("text");
            let book = document.getElementById(bookId);
            
            if (book && book.parentElement.id === 'book-pile') {
                book.style.opacity = '1';
                shelf.appendChild(book); 
                
                placedBooks++;
                scoreElement.innerText = placedBooks;
                checkVictory();
            }
        }

        document.addEventListener('dragend', function(e) {
            if(e.target.classList.contains('book')) {
                e.target.style.opacity = '1';
            }
        });

        function checkVictory() {
            if (placedBooks >= totalBooks) {
                document.getElementById('victory').style.display = 'flex';
                createExplosion();
            }
        }


        // --- ЧАСТИЦЫ ---
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor(x, y, isExplosion = false) {
                this.x = x || Math.random() * width;
                this.y = y || Math.random() * height;
                this.size = Math.random() * 2 + 0.5;
                this.vx = isExplosion ? (Math.random() - 0.5) * 15 : (Math.random() - 0.5) * 0.4;
                this.vy = isExplosion ? (Math.random() - 0.5) * 15 : (Math.random() * -1) - 0.1;
                this.life = isExplosion ? Math.random() * 80 + 20 : 999999;
                
                const colors = ['#ffd700', '#ffb6c1', '#ffffff', '#ff8c00'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.glow = Math.random() * 8 + 2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;

                if (this.y < 0) this.y = height;
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = this.glow;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0; 
            }
        }

        for (let i = 0; i < 150; i++) particles.push(new Particle());

        function createExplosion() {
            for (let i = 0; i < 500; i++) {
                particles.push(new Particle(width/2, height/2, true));
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update();
                p.draw();
                if (p.life <= 0) particles.splice(i, 1);
            }
            requestAnimationFrame(animateParticles);
        }

        // Запуск
        initGame();
        animateParticles();
    </script>
</body>
</html>
